<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>구독셈 · 내 구독료 얼마야?</title>
<meta name="description" content="쓰는 구독만 체크하면 한 달·1년 구독료가 바로 나와요. 결제 문자 캡처를 올리면 폰 안에서 읽어서 추가해요.">
<meta name="theme-color" content="#F1ECFF">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="구독셈">
<meta property="og:title" content="구독셈 · 내 구독료 얼마야?">
<meta property="og:description" content="체크만 하면 한 달·1년 구독료가 바로 나와요 💸">
<meta property="og:url" content="https://vibecode-note.github.io/gudoksem/">
<meta property="og:type" content="website">
<meta property="og:image" content="https://vibecode-note.github.io/gudoksem/icons/og.png">
<meta name="twitter:card" content="summary_large_image">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root {
  --ink: #221D35; --sub: #6F6889; --faint: #ABA5BF; --card: #FFFFFF; --field: #F5F2FC; --line: #EEEAF7;
  --violet: #7B5CFF; --pink: #FF6FAE; --mint: #2FCB8E; --sun: #FFD43B; --tint: #F4F0FF;
  --round: 'Jua', 'Pretendard Variable', sans-serif;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html { background: #F1ECFF; }
body {
  margin: 0; min-height: 100dvh; color: var(--ink); letter-spacing: -0.015em; font-feature-settings: 'tnum';
  font-family: 'Pretendard Variable', Pretendard, -apple-system, system-ui, sans-serif;
  background: radial-gradient(120% 60% at 0% 0%, #E9E2FF 0%, transparent 60%), radial-gradient(90% 50% at 100% 30%, #FFE3EF 0%, transparent 60%), radial-gradient(90% 50% at 0% 90%, #DDF7EC 0%, transparent 60%), #F7F4FF;
  background-attachment: fixed;
}
.app { max-width: 440px; margin: 0 auto; padding: calc(env(safe-area-inset-top) + 16px) 16px calc(env(safe-area-inset-bottom) + 120px); }
:focus-visible { outline: 3px solid var(--violet); outline-offset: 2px; }
button { font: inherit; color: inherit; }

.top { display: flex; align-items: center; gap: 10px; padding: 4px 6px 16px; }
.top h1 { margin: 0; font-family: var(--round); font-weight: 400; font-size: 28px; }
.top .tag { margin-left: auto; font-size: 13px; font-weight: 600; color: var(--violet); background: #fff; padding: 6px 11px; border-radius: 999px; box-shadow: 0 2px 8px rgba(123,92,255,.12); }

/* 합계 카드 */
.hero { position: relative; border-radius: 28px; padding: 22px 22px 20px; color: #fff; background: linear-gradient(135deg, #7B5CFF 0%, #A65CFF 55%, #FF6FAE 100%); box-shadow: 0 16px 36px rgba(123,92,255,.32); overflow: hidden; }
.hero::before { content: ''; position: absolute; width: 220px; height: 220px; right: -70px; bottom: -110px; border-radius: 50%; background: rgba(255,255,255,.12); }
.hero .label { font-size: 15px; font-weight: 600; opacity: .9; }
.hero .month { font-family: var(--round); font-size: 50px; line-height: 1.1; margin: 6px 0 2px; }
.hero .mood { font-size: 14px; font-weight: 600; opacity: .95; }
.sticker { position: absolute; top: 14px; right: 16px; font-size: 54px; transform: rotate(10deg); filter: drop-shadow(0 6px 10px rgba(0,0,0,.18)); transition: transform .3s; }
.sticker.pop { animation: pop .45s cubic-bezier(.3,1.6,.5,1); }
@keyframes pop { 0% { transform: rotate(10deg) scale(.6); } 100% { transform: rotate(10deg) scale(1); } }
.chips { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 16px; position: relative; }
.chip { background: rgba(255,255,255,.18); backdrop-filter: blur(6px); border-radius: 16px; padding: 10px 8px; text-align: center; }
.chip i { display: block; font-style: normal; font-size: 22px; }
.chip span { display: block; font-size: 12px; opacity: .85; margin-top: 2px; }
.chip b { display: block; font-size: 15px; font-weight: 800; }

/* 목록 */
.box { background: var(--card); border-radius: 26px; padding: 18px 14px 10px; margin-top: 16px; box-shadow: 0 6px 20px rgba(80,60,160,.07); }
.box h2 { margin: 0 8px 10px; font-size: 17px; font-weight: 700; }
.box h2 small { display: block; font-size: 13px; font-weight: 500; color: var(--sub); margin-top: 3px; }
.item { border-radius: 18px; padding: 12px 10px; cursor: pointer; transition: background .2s; }
.item + .item { margin-top: 4px; }
.item.on { background: var(--tint); }
.main { display: flex; align-items: center; gap: 12px; }
.emo { width: 46px; height: 46px; flex: none; border-radius: 15px; display: grid; place-items: center; font-size: 24px; background: var(--bg, #F3F0FA); transition: transform .2s, filter .2s; }
.item:not(.on) .emo { filter: grayscale(.85); opacity: .6; }
.item.on .emo { transform: rotate(-6deg); }
.nm { flex: 1; min-width: 0; }
.nm b { display: block; font-size: 16px; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.nm small { font-size: 13px; color: var(--sub); }
.item:not(.on) .nm b { color: var(--sub); font-weight: 600; }
.price { display: flex; align-items: baseline; }
.price input { width: 76px; border: 0; background: none; text-align: right; font: inherit; font-size: 16px; font-weight: 800; color: var(--ink); padding: 6px 2px; border-radius: 8px; }
.price input:focus { outline: none; background: #fff; }
.item:not(.on) .price input { color: var(--faint); font-weight: 600; }
.price span { font-size: 14px; color: var(--sub); }
.check { width: 28px; height: 28px; flex: none; border-radius: 50%; border: 2px solid var(--line); background: #fff; display: grid; place-items: center; font-size: 15px; transition: all .15s; }
.item.on .check { background: var(--violet); border-color: var(--violet); color: #fff; }
.plans { display: flex; gap: 6px; flex-wrap: wrap; margin: 10px 0 2px 58px; }
.plans button { border: 0; background: #fff; color: var(--sub); font-size: 13px; font-weight: 700; padding: 7px 11px; border-radius: 999px; cursor: pointer; box-shadow: inset 0 0 0 1.5px var(--line); }
.plans button.on { background: var(--violet); color: #fff; box-shadow: none; }
.del { border: 0; background: none; color: var(--faint); font-size: 13px; cursor: pointer; padding: 6px 0 0 58px; text-decoration: underline; }
.item.new { animation: flash 1.4s ease-out; }
@keyframes flash { 0% { background: #FFF1B8; } 100% { background: var(--tint); } }

/* 추가 */
.tabs { display: flex; gap: 6px; background: var(--field); border-radius: 16px; padding: 5px; margin: 0 4px; }
.tabs button { flex: 1; height: 42px; border: 0; border-radius: 12px; background: none; color: var(--sub); font-size: 14px; font-weight: 700; cursor: pointer; }
.tabs button[aria-selected=true] { background: #fff; color: var(--ink); box-shadow: 0 2px 6px rgba(80,60,160,.12); }
.more { display: grid; gap: 8px; padding: 12px 4px 10px; }
.field { width: 100%; border: 0; border-radius: 14px; background: var(--field); color: var(--ink); font: inherit; font-size: 16px; padding: 14px 16px; }
textarea.field { min-height: 88px; resize: vertical; line-height: 1.5; }
.pair { display: grid; grid-template-columns: 1fr 116px; gap: 8px; }
.ghost { height: 50px; border: 0; border-radius: 14px; background: var(--ink); color: #fff; font-size: 15px; font-weight: 700; cursor: pointer; }
.foot { font-size: 12px; color: var(--sub); line-height: 1.6; text-align: center; padding: 18px 12px 0; }

/* 아래 고정 */
.dock { position: fixed; left: 0; right: 0; bottom: 0; padding: 14px 16px calc(env(safe-area-inset-bottom) + 14px); background: linear-gradient(rgba(247,244,255,0), #F7F4FF 35%); }
.dock-in { max-width: 408px; margin: 0 auto; }
.toast:empty { display: none; }
.toast { margin-bottom: 10px; padding: 13px 16px; border-radius: 16px; background: var(--ink); color: #fff; font-size: 14px; font-weight: 600; line-height: 1.45; box-shadow: 0 8px 20px rgba(34,29,53,.25); }
.toast.bad { background: #E5484D; }
.primary { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; height: 60px; border: 0; border-radius: 20px; color: #fff; font-family: var(--round); font-size: 20px; cursor: pointer; background: linear-gradient(135deg, #7B5CFF, #FF6FAE); box-shadow: 0 10px 24px rgba(166,92,255,.4); }
.primary:active, .ghost:active, .plans button:active, .item:active { transform: scale(.98); }
.primary[aria-busy=true] { opacity: .8; pointer-events: none; }
.hint { text-align: center; font-size: 12px; color: var(--sub); margin-top: 8px; }

@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body>
<main class="app">
  <header class="top">
    <h1>구독셈 💸</h1>
    <span class="tag">내 구독료 얼마야?</span>
  </header>

  <section class="hero" aria-live="polite">
    <div class="sticker" id="sticker" aria-hidden="true">🫥</div>
    <div class="label">이번 달 구독으로 나가는 돈</div>
    <div class="month" id="month">0원</div>
    <div class="mood" id="mood"></div>
    <div class="chips">
      <div class="chip"><i>📅</i><span>1년이면</span><b id="year">0원</b></div>
      <div class="chip"><i>🍗</i><span>치킨으로</span><b id="chicken">0마리</b></div>
      <div class="chip"><i>🧋</i><span>아아로</span><b id="coffee">0잔</b></div>
    </div>
  </section>

  <section class="box">
    <h2>지금 쓰는 구독 골라줘 👇<small>눌러서 체크, 금액은 눌러서 고칠 수 있어요</small></h2>
    <div id="list"></div>
  </section>

  <section class="box">
    <h2>목록에 없어? ✍️</h2>
    <div class="tabs" role="tablist">
      <button role="tab" aria-selected="true" data-tab="add">직접 입력</button>
      <button role="tab" aria-selected="false" data-tab="paste">결제 문자 붙여넣기</button>
    </div>
    <div class="more" id="tab-add">
      <div class="pair"><input class="field" id="nName" placeholder="예) 티빙, 멜론"><input class="field" id="nPrice" inputmode="numeric" placeholder="월 금액"></div>
      <button class="ghost" id="addBtn">추가하기</button>
    </div>
    <div class="more" id="tab-paste" hidden>
      <textarea class="field" id="sms" placeholder="카드 결제 문자를 그대로 붙여넣어 줘"></textarea>
      <button class="ghost" id="read">문자 읽고 추가하기</button>
    </div>
  </section>

  <p class="foot" id="foot"></p>
</main>

<div class="dock">
  <div class="dock-in">
    <div class="toast" id="msg" role="status"></div>
    <label class="primary" id="scanBtn">📸 <span id="scanText">결제 문자 캡처로 추가</span><input id="file" type="file" accept="image/*" hidden></label>
    <div class="hint">🔒 캡처는 서버로 안 보내고 이 폰 안에서만 읽어요</div>
  </div>
</div>

<script type="module">
import { SERVICES, PRICED_AT, CHICKEN, COFFEE, defaults, totals, parseReceipt, applyReceipt } from './subs.js';

const KEY = 'gudoksem-v1';
const TINT = { netflix: '#FFE4E6', youtube: '#FFE9E4', coupang: '#E6F0FF', naver: '#DFF7EA', disney: '#E5E9FF' };
const CUSTOM = ['🎧', '📚', '🎮', '☁️', '🎵', '🧾'];
const $ = (id) => document.getElementById(id);
const won = (n) => n.toLocaleString('ko-KR');
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => `&#${c.charCodeAt(0)};`);
let items, fresh = null, toastTimer, lastMood = null;
try { items = JSON.parse(localStorage.getItem(KEY)) || defaults(); } catch { items = defaults(); }
// 예전 저장분 이모지 맞추기
items.forEach((i) => { const s = SERVICES.find((x) => x.id === i.id); if (s) i.emoji = s.emoji; });

function save() { try { localStorage.setItem(KEY, JSON.stringify(items)); } catch {} }
function say(text, kind = '') {
  const m = $('msg'); m.className = 'toast ' + kind; m.textContent = text;
  clearTimeout(toastTimer); if (kind !== 'busy') toastTimer = setTimeout(() => { m.textContent = ''; }, 3500);
}
const mood = (m) => (!m ? ['🫥', '아직 고른 구독이 없어요'] : m < 20000 ? ['😌', '아직은 귀여운 수준'] : m < 50000 ? ['😬', '슬슬 묵직해지는 중'] : ['🫠', '지갑 녹는 중… 하나쯤 정리해 볼까?']);

function render() {
  const t = totals(items);
  $('month').textContent = won(t.month) + '원';
  const [face, line] = mood(t.month);
  $('mood').textContent = line;
  if (face !== lastMood) { const s = $('sticker'); s.textContent = face; s.classList.remove('pop'); void s.offsetWidth; s.classList.add('pop'); lastMood = face; }
  $('year').textContent = won(t.year) + '원';
  $('chicken').textContent = t.chicken + '마리';
  $('coffee').textContent = t.coffee + '잔';

  $('list').innerHTML = items.map((i, k) => {
    const svc = SERVICES.find((s) => s.id === i.id);
    const plans = i.on && svc && svc.plans.length > 1
      ? `<div class="plans" role="group" aria-label="${esc(i.name)} 요금제">${svc.plans.map(([n, p]) => `<button data-k="${k}" data-p="${p}" class="${i.plan === n ? 'on' : ''}" aria-pressed="${i.plan === n}">${n} ${won(p)}</button>`).join('')}</div>` : '';
    const sub = svc ? (svc.plans.length > 1 ? (i.plan === '직접' ? '직접 입력한 금액' : i.plan) : '월 요금') : '직접 추가';
    return `<div class="item ${i.on ? 'on' : ''} ${i.id === fresh ? 'new' : ''}" data-k="${k}" role="checkbox" aria-checked="${i.on}" tabindex="0">
      <div class="main">
        <span class="emo" style="--bg:${TINT[i.id] || '#F3F0FA'}" aria-hidden="true">${esc(i.emoji || '🧾')}</span>
        <div class="nm"><b>${esc(i.name)}</b><small>${esc(sub)}</small></div>
        <label class="price"><input data-k="${k}" inputmode="numeric" value="${won(+i.price || 0)}" aria-label="${esc(i.name)} 월 금액"><span>원</span></label>
        <span class="check" aria-hidden="true">${i.on ? '✓' : ''}</span>
      </div>
      ${plans}
      ${i.custom ? `<button class="del" data-del="${k}">목록에서 지우기</button>` : ''}
    </div>`;
  }).join('');
  fresh = null;
  save();
}

function toggle(k) { items[k].on = !items[k].on; render(); }
$('list').addEventListener('click', (e) => {
  if (e.target.closest('.price')) return;
  const plan = e.target.closest('.plans button'), del = e.target.closest('[data-del]'), row = e.target.closest('.item');
  if (del) { items.splice(+del.dataset.del, 1); return render(); }
  if (plan) {
    const i = items[plan.dataset.k], p = SERVICES.find((s) => s.id === i.id).plans.find(([, v]) => v === +plan.dataset.p);
    i.plan = p[0]; i.price = p[1]; return render();
  }
  if (row) toggle(+row.dataset.k);
});
$('list').addEventListener('keydown', (e) => {
  if (e.target.classList.contains('item') && (e.key === ' ' || e.key === 'Enter')) { e.preventDefault(); toggle(+e.target.dataset.k); }
});
$('list').addEventListener('change', (e) => {
  const k = e.target.dataset.k; if (k == null) return;
  const i = items[k], svc = SERVICES.find((s) => s.id === i.id);
  i.price = +e.target.value.replace(/\D/g, '') || 0;
  i.on = i.price > 0;
  if (svc) i.plan = svc.plans.find(([, p]) => p === i.price)?.[0] || '직접';
  render();
});

document.querySelector('.tabs').addEventListener('click', (e) => {
  const b = e.target.closest('[data-tab]'); if (!b) return;
  document.querySelectorAll('.tabs button').forEach((x) => x.setAttribute('aria-selected', x === b));
  $('tab-add').hidden = b.dataset.tab !== 'add';
  $('tab-paste').hidden = b.dataset.tab !== 'paste';
});

function apply(text) {
  const parsed = parseReceipt(text);
  const r = applyReceipt(items, parsed);
  if (r.items === items) return say(r.msg, 'bad');
  const before = new Set(items.map((i) => i.id));
  items = r.items;
  const added = items.find((i) => !before.has(i.id));
  if (added) added.emoji = CUSTOM[items.length % CUSTOM.length];
  fresh = parsed.service?.id || added?.id || items.find((i) => i.name === parsed.name)?.id;
  render(); say('✨ ' + r.msg);
}
$('read').onclick = () => $('sms').value.trim() ? apply($('sms').value) : say('결제 문자를 붙여넣어 줘!', 'bad');

// 글자 인식: tesseract.js를 처음 쓸 때만 불러옴
let worker;
async function ocr(file) {
  if (!worker) {
    await new Promise((ok, no) => { const s = document.createElement('script'); s.src = 'https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js'; s.onload = ok; s.onerror = no; document.head.append(s); });
    worker = await Tesseract.createWorker(['kor', 'eng']);
  }
  return (await worker.recognize(file)).data.text;
}
$('file').onchange = async (e) => {
  const f = e.target.files[0]; e.target.value = '';
  if (!f) return;
  $('scanBtn').setAttribute('aria-busy', 'true'); $('scanText').textContent = '캡처 읽는 중… 👀';
  say('처음 한 번은 글자 인식 준비로 10초쯤 걸려요', 'busy');
  try {
    const text = await ocr(f);
    $('sms').value = text.trim();
    apply(text);
  } catch { say('캡처를 못 읽었어요. 인터넷 연결을 확인하거나 결제 문자를 붙여넣어 줘.', 'bad'); }
  $('scanBtn').removeAttribute('aria-busy'); $('scanText').textContent = '결제 문자 캡처로 추가';
};

$('addBtn').onclick = () => {
  const name = $('nName').value.trim(), price = +$('nPrice').value.replace(/\D/g, '');
  if (!name || !price) return say('이름이랑 월 금액 둘 다 넣어 줘!', 'bad');
  const id = `c${Date.now()}`;
  items.push({ id, name, emoji: CUSTOM[items.length % CUSTOM.length], on: true, price, custom: true });
  $('nName').value = $('nPrice').value = '';
  fresh = id; render(); say(`✨ ${name} ${won(price)}원 추가했어요`);
};

$('foot').textContent = `기본 요금은 ${PRICED_AT} 기준이에요. 치킨 ${won(CHICKEN)}원, 아아 ${won(COFFEE)}원으로 대충 셌어요. 체크한 건 이 폰에만 저장돼요.`;
render();
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
</html>
